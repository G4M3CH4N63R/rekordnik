<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rekordník</title>
<meta name="theme-color" content="#12715A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rekordník">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Vzhled podle Síně rekordů: zelený pruh nahoře jako atletická dráha, kartičky disciplín, ročníky jako dráhy */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --ink:#14251E; --muted:#5A6A62; --line:#D6DFDA;
  --accent:#12715A; --accent-soft:#E0F0E9; --on-accent:#FFFFFF;
  --track:#12715A; --track-soft:#DDEFE7;
  --gold:#A87405; --gold-soft:#FBF0D3; --warn:#B0501A; --warn-soft:#FBE8DB;
  --boys:#2F6887; --girls:#A23E6C;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1714; --surface:#15211C; --ink:#E5ECE8; --muted:#93A49C; --line:#27382F;
  --accent:#4CC39A; --accent-soft:#16392D; --on-accent:#08130F;
  --track:#145E4A; --track-soft:#173A2E;
  --gold:#E3B547; --gold-soft:#3A2E10; --warn:#F08A55; --warn-soft:#3C2116;
  --boys:#7FB3D1; --girls:#DE8DB3; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.app{max-width:1100px;margin:0 auto;padding:0 16px 110px}
main.narrow{max-width:680px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
header.track{background:var(--track);color:#fff;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
header.track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 22px,rgba(255,255,255,.22) 22px 24px);pointer-events:none;opacity:.55}
.hero{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:13px;font-weight:600;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font-family:var(--display);font-weight:700;font-size:clamp(38px,9vw,60px);line-height:.92;margin-top:2px;letter-spacing:.01em}
.hero>div:first-child{min-width:0}
.topr{display:flex;align-items:center;gap:6px;flex:none}
.syncdot{font-size:12px;color:#fff;display:flex;align-items:center;gap:6px;opacity:.95}
.syncdot i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45);display:inline-block}
.syncdot.ok i{background:#fff} .syncdot.err i{background:#FFB38A} .syncdot.busy i{background:#F5C451}
.iconbtn{all:unset;cursor:pointer;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:#fff}
.iconbtn:focus-visible{outline:3px solid #fff;outline-offset:1px}
.iconbtn[aria-current="page"]{background:rgba(255,255,255,.22)}
.iconbtn svg{width:24px;height:24px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:20px 0 12px;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:26px 0 10px;letter-spacing:.01em}
h2 small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);margin-left:8px}
p{margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
select,input[type=date],input[type=search],input[type=text],input[type=password],input[type=url]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel+.panel{margin-top:10px}
.panel h2{font-size:22px}
.k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--warn);font-weight:600}
/* ročníky jako dráhy */
.controls{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding-block:14px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.lanes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lanes .lbl{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted);margin-right:4px}
.lane{font-family:var(--display);font-weight:700;font-size:20px;width:42px;height:42px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.lane:hover{border-color:var(--track)}
.lane[aria-pressed="true"]{background:var(--track);border-color:var(--track);color:#fff}
.lane:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.search{flex:1 1 220px;max-width:340px}
/* kartičky disciplín */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.card h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0;padding:10px 14px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px;line-height:1.15}
.card h3 span{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:right}
.card .foot{padding:8px 14px 10px;border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:30px 1fr auto;gap:4px 10px;align-items:center;padding:10px 14px}
.rrow+.rrow{border-top:1px dashed var(--line)}
.sym{font-size:22px;line-height:1;font-weight:700;text-align:center}
.sym.M{color:var(--boys)} .sym.F{color:var(--girls)} .sym.X{color:var(--track);font-size:15px;font-family:var(--display)}
.who{min-width:0}
.who .n{font-weight:600;overflow-wrap:anywhere}
.who .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rrow .val,.res .val{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;white-space:nowrap}
.new{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;background:var(--track-soft);color:var(--accent);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.rrow.nic .n{color:var(--muted);font-weight:500}
.rrow.nic .val{color:var(--muted);font-size:20px}
.runners{margin:2px 0 0;padding:0;list-style:none;font-weight:600}
.hl{background:var(--track-soft);border-radius:3px;padding:0 2px}
.fresh{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.fcard:hover{border-color:var(--track)}
.fcard .d{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fcard .n{font-weight:600}
.fcard .v{font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums}
.results{display:grid;gap:8px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.res .val{font-size:24px}
/* seznamy */
.list{display:flex;flex-direction:column;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kid{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding:10px 14px;border-top:1px dashed var(--line)}
.kid:first-child{border-top:0}
.kid .nm{font-weight:600;min-width:0}
.kid .sub{font-size:13px;color:var(--muted)}
.kid .chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kid .chips:empty{display:none}
.kid.isrec{background:var(--gold-soft)}
.sx{display:inline-block;font-weight:700;margin-right:6px;font-size:1.05em;line-height:1}
.sx.M{color:var(--boys)} .sx.F{color:var(--girls)}
.sx.M::before{content:"♂"} .sx.F::before{content:"♀"}
.inp{font:inherit;font-family:var(--display);font-size:24px;font-weight:700;width:112px;text-align:right;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.inp::placeholder{color:var(--muted);opacity:.5;font-weight:500}
.chip{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.chip.pb{background:var(--accent-soft);color:var(--accent)}
.chip.rec{background:var(--gold);color:var(--surface)}
.chip.chk{background:var(--warn-soft);color:var(--warn)}
.chip.first{background:var(--line);color:var(--muted)}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:6px;padding:11px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--warn);color:#fff}
.btn.small{font-size:14px;padding:7px 12px}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.08);z-index:3}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{font:inherit;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:6px;cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:#fff;background:var(--track)}
.badge{position:absolute;top:2px;right:calc(50% - 24px);background:var(--gold);color:#fff;font-family:var(--body);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;letter-spacing:0}
.kidbtn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px dashed var(--line);cursor:pointer}
.kidbtn:first-child{border-top:0}
.kidbtn:hover{background:var(--bg)}
.kidbtn:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.kidbtn .cl{font-family:var(--display);font-weight:700;color:var(--muted);font-size:20px;align-self:center}
.back{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:15px}
.dc .cb{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.dc .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dc svg{width:100%;height:40px;display:block}
.dc details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.dc ul{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
.dc li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px dashed var(--line);align-items:center}
.rank{font-size:13px;color:var(--accent);font-weight:600}
.lb{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lbr{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px dashed var(--line)}
.lbr:first-child{border-top:0}
.pos{font-family:var(--display);font-size:22px;font-weight:700;color:var(--muted);text-align:center}
.lbr.p1 .pos{color:var(--accent)}
.lbr .val{font-family:var(--display);font-size:24px;font-weight:700}
.up{color:var(--accent);font-weight:600}
.strip svg{width:100%;height:auto;display:block}
.empty{padding:18px 14px;color:var(--muted);font-size:15px}
.okbox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:12px 14px;margin-top:12px}
.okbox b{color:var(--accent);font-family:var(--display);font-size:20px;letter-spacing:.02em}
.okbox p{margin:4px 0 0}
.appr{background:var(--gold-soft);border:1px solid var(--gold);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.appr .big{font-family:var(--display);font-size:26px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:15px;z-index:9;max-width:calc(100% - 32px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-family:var(--display);font-size:18px;font-weight:700;border:0;background:none;color:var(--muted);padding:7px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--track);color:#fff}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:600;letter-spacing:.06em;background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:10px 12px;user-select:all;word-break:break-all}
.upd{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--track);color:#fff;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:8;font-weight:600}
.upd button{font:inherit;font-weight:700;border:0;background:#fff;color:var(--track);border-radius:6px;padding:6px 12px;cursor:pointer}
.ul{display:flex;flex-direction:column;gap:8px}
.ul .u{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.lane{width:32px;height:38px;font-size:18px}.lanes{gap:5px}.lanes .lbl{display:none}.grid{grid-template-columns:1fr}.fresh{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.fcard{flex:0 0 170px;scroll-snap-align:start}.syncdot span{display:none}}
@media (min-width:601px){.controls{position:sticky;top:0;z-index:4}}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}.card,.fcard,.lane{transition:border-color .15s}}
</style>
</head>
<body>
<header class="track">
  <div class="hero">
    <div><div class="eyebrow" id="kdo">ZŠ Mendelova · Tělesná výchova</div><div class="title">Rekordník</div></div>
    <div class="topr">
      <span class="syncdot" id="syncdot" title="Synchronizace"><i></i><span id="synctext"></span></span>
      <button class="iconbtn" id="btnNast" aria-label="Nastavení"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </div>
</header>
<div class="app">
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Hlavní menu" id="nav"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>
<div class="upd" id="upd" hidden><span>Je k dispozici nová verze.</span><button id="updBtn">Načíst</button></div>

<script>
"use strict";
/* ==========================================================================
   Rekordník · společná evidence výkonů v TV, ZŠ Mendelova
   Verze se zvyšuje spolu s CACHE v sw.js.
   ========================================================================== */
const VERZE = "1.5.0";
// Adresa Workeru po nasazení. Prázdná = zadává se v Nastavení.
const VYCHOZI_SERVER = "https://rekordnik.chuanito-bonito.workers.dev";

/* ---------- disciplíny (dohoda kolektivu 13. 10. 2026) ---------- */
const DISC = {
  d60:{n:"60 m",u:"s",low:true,min:6,max:20},
  d200:{n:"200 m",u:"s",low:true,min:22,max:80},
  d400:{n:"400 m",u:"min",low:true,min:50,max:200},
  d500:{n:"500 m",u:"min",low:true,min:70,max:260},
  d1000:{n:"1000 m",u:"min",low:true,min:150,max:600},
  zm:{n:"Skok z místa",u:"cm",low:false,min:50,max:350},
  dal:{n:"Skok daleký",u:"cm",low:false,min:100,max:700},
  vys:{n:"Skok vysoký",u:"cm",low:false,min:50,max:220},
  rak:{n:"Hod raketkou",u:"m",low:false,min:2,max:90},
  kou:{n:"Vrh koulí",u:"m",low:false,min:1,max:20},
  spl:{n:"Šplh",u:"s",low:true,min:2,max:40},
  mic:{n:"Hod míčkem (do 2025/26)",u:"m",low:false,min:2,max:90,stara:true},
  sta:{n:"Štafeta 4×60 m",u:"s",low:true,min:25,max:90,tym:true}
};
const PET="Vrh petanque koulí", K3="Vrh koulí 3 kg", K34="Vrh koulí (holky 3 kg, kluci 4 kg)";
const NAME_OVR={1:{spl:"Šplh 1/2 tyče",kou:PET,d1000:"1000 m (do 2025/26)"},2:{kou:PET},3:{kou:PET},4:{kou:PET},5:{kou:PET},6:{kou:K3},7:{kou:K3},8:{kou:K34},9:{kou:K34}};
const dn=(d,g)=>d==="sta"&&g<=5?"Smíšená štafeta 4×60 m":(NAME_OVR[g]&&NAME_OVR[g][d])||DISC[d].n;
const GD={};
for(let g=1;g<=9;g++){
  GD[g]=["d60","d200","d400",g<=4?"d500":"d1000","zm","dal","vys","rak","kou","spl","sta"];
}
const better=(a,b,d)=>DISC[d].low?a<b:a>b;
const GDi=g=>GD[g].filter(d=>!DISC[d].tym);   // disciplíny jednotlivců
const staSex=(g,sex)=>g<=5?"X":sex;           // štafeta na 1. stupni je smíšená

/* ---------- pomocné ---------- */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cz=n=>String(n).replace(".",",");
const plural=(n,a,b,c)=>n===1?a:(n>=2&&n<=4?b:c);
const dnes=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const datum=iso=>{if(!iso)return "";const [y,m,d]=iso.split("-");return (+d)+". "+(+m)+". "+y;};
const skolniRok=iso=>{const y=+iso.slice(0,4),m=+iso.slice(5,7);return m>=9?y:y-1;};
const syLabel=sy=>sy+"/"+String(sy+1).slice(2);

const uid=p=>p+"_"+[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join("");
function rnd(v,u){return u==="s"||u==="m"?Math.round(v*100)/100:u==="min"?Math.round(v*10)/10:Math.round(v);}
function fmt(v,u){
  if(v==null||isNaN(v)) return "";
  if(u==="s") return cz(v.toFixed(2))+" s";
  if(u==="m") return cz(v.toFixed(2))+" m";
  if(u==="cm") return Math.round(v)+" cm";
  const m=Math.floor(v/60),s=v-m*60;return m+":"+cz(s.toFixed(1).padStart(4,"0"))+" min";
}
function parseVal(str,d){
  if(str==null||!String(str).trim()) return null;
  let t=String(str).trim().replace(/\s*(min|cm|s|m)\.?$/i,"").replace(/,/g,".").replace(/\s+/g,"");
  let v;
  if(t.includes(":")){const p=t.split(":");v=(+p[0])*60+(+p[1]);} else v=+t;
  if(!isFinite(v)||v<=0) return NaN;
  if(DISC[d].u==="cm"&&v<10) v=v*100;
  return rnd(v,DISC[d].u);
}

function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,4000);}
const b64=u8=>{let s="";u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s);};

/* ---------- IndexedDB ---------- */
const DBNAME="rekordnik", DBVER=1;
const STORES=["meta","zaci","vykony","rekordy","sys","fronta"];
let _db;
function dbOpen(){
  return new Promise((ok,ko)=>{
    const r=indexedDB.open(DBNAME,DBVER);
    r.onupgradeneeded=()=>{const db=r.result;for(const s of STORES) if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:s==="meta"?"k":"id"});};
    r.onsuccess=()=>{_db=r.result;ok(_db);};
    r.onerror=()=>ko(r.error);
  });
}
function tx(store,mode,fn){
  return new Promise((ok,ko)=>{
    const t=_db.transaction(store,mode);const st=t.objectStore(store);let res;
    const r=fn(st); if(r&&"onsuccess" in r) r.onsuccess=()=>{res=r.result;};
    t.oncomplete=()=>ok(res); t.onerror=()=>ko(t.error); t.onabort=()=>ko(t.error);
  });
}
const dbAll=s=>tx(s,"readonly",st=>st.getAll());
const dbGet=(s,k)=>tx(s,"readonly",st=>st.get(k));
const dbPut=(s,v)=>tx(s,"readwrite",st=>st.put(v));
const dbDel=(s,k)=>tx(s,"readwrite",st=>st.delete(k));
const dbClear=s=>tx(s,"readwrite",st=>st.clear());
function dbPutMany(s,list){return new Promise((ok,ko)=>{const t=_db.transaction(s,"readwrite");const st=t.objectStore(s);for(const v of list) st.put(v);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);});}
const metaGet=async k=>{const r=await dbGet("meta",k);return r?r.v:undefined;};
const metaSet=(k,v)=>dbPut("meta",{k,v});

/* ---------- šifrování (heslo kolektivu) ---------- */
let KEY=null;
async function odvodKlic(heslo,sulB64){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(heslo),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(sulB64),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function zasifruj(obj,key=KEY){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out);
}
async function rozsifruj(s,key=KEY){
  const u=unb64(s);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}

const trida=(z,sy=SY_NOW())=>{const g=rocnik(z,sy);return g>=1&&g<=9?g+"."+z.pis:null;};

async function nactiPamet(){
  S.vykony=new Map((await dbAll("vykony")).filter(x=>x.data).map(x=>[x.rid,{...x.data,id:x.rid}]));
  S.sys=new Map((await dbAll("sys")).filter(x=>x.data).map(x=>[x.rid,x.data]));
  await rozsifrujVse();
}
async function rozsifrujVse(){
  S.zaci=new Map(); S.rekordy=new Map(); S.rawZaci=[];
  const zr=(await dbAll("zaci")).filter(x=>x.data);
  const rr=(await dbAll("rekordy")).filter(x=>x.data);
  for(const x of zr){
    if(!KEY){S.rawZaci.push(x);continue;}
    try{S.zaci.set(x.rid,{...(await rozsifruj(x.data.enc)),id:x.rid});}catch(e){S.rawZaci.push(x);}
  }
  for(const x of rr){
    const r={...x.data};
    if(r.enc&&KEY){try{r.jm=(await rozsifruj(r.enc)).jm;}catch(e){r.jm="?";}}
    S.rekordy.set(x.rid,r);
  }
  for(const v of S.vykony.values()) if(v.tymEnc&&KEY&&!v.tymTxt){try{v.tymTxt=(await rozsifruj(v.tymEnc)).jm;}catch(e){}}
}

const PUSH={stav:"?",endpoint:""};
const pushPodpora=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window&&window.isSecureContext;
const jeIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const naPlose=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
async function pushZjisti(){
  if(!pushPodpora()){PUSH.stav="nejde";return;}
  try{const reg=await Promise.race([navigator.serviceWorker.ready,new Promise(ok=>setTimeout(()=>ok(null),5000))]);
    if(!reg){PUSH.stav="nejde";return;}
    const sub=await reg.pushManager.getSubscription();
    PUSH.endpoint=sub?sub.endpoint:"";PUSH.stav=sub&&Notification.permission==="granted"?"zapnuto":Notification.permission==="denied"?"zakazano":"vypnuto";}
  catch(_){PUSH.stav="nejde";}
}
function b64uNaBajty(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return Uint8Array.from(atob(t),c=>c.charCodeAt(0));}
async function pushZapnout(){
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){await pushZjisti();render();toast("Upozornění nejsou povolená. Povol je v nastavení telefonu.");return;}
  const reg=await navigator.serviceWorker.ready;
  const {klic}=await api("/push/klic");
  let sub=await reg.pushManager.getSubscription();
  if(sub&&sub.options&&sub.options.applicationServerKey){const k=new Uint8Array(sub.options.applicationServerKey);const n=b64uNaBajty(klic);if(k.length!==n.length||k.some((x,i)=>x!==n[i])){await sub.unsubscribe();sub=null;}}
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uNaBajty(klic)});
  await api("/push/prihlasit",{sub:sub.toJSON()});
  await pushZjisti();render();toast("Upozornění zapnutá.");
}
async function pushVypnout(){
  const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
  if(sub){try{await api("/push/odhlasit",{endpoint:sub.endpoint});}catch(_){}await sub.unsubscribe();}
  await pushZjisti();render();toast("Upozornění vypnutá.");
}

  return `<h2>Upozornění</h2><div class="panel"><p class="hint">${co} Zapíná se zvlášť na každém zařízení.</p>${obsah}</div>`;

async function api(cesta,telo,metoda){
  const r=await fetch(S.server.replace(/\/+$/,"")+cesta,{method:metoda||(telo?"POST":"GET"),headers:{"authorization":"Bearer "+S.kod,"content-type":"application/json"},body:telo?JSON.stringify(telo):undefined,cache:"no-store"});

  if(!r.ok||j.chyba){const e=new Error(j.chyba||("HTTP "+r.status));e.status=r.status;throw e;}
  return j;
}
let _syncT=null,_syncBezi=false,_syncZnovu=false;
function naplanujSync(ms){clearTimeout(_syncT);_syncT=setTimeout(syncNow,ms);}
function nastavSyncStav(s,chyba){S.syncStav=s;S.syncChyba=chyba||"";const el=$("#syncdot");el.className="syncdot "+(s==="ok"?"ok":s==="err"?"err":s==="busy"?"busy":"");$("#synctext").textContent=s==="err"?"offline":s==="busy"?"…":"";el.title=chyba||"Synchronizace";}
async function syncNow(){
  if(!S.server||!S.kod) return;
  if(_syncBezi){_syncZnovu=true;return;}
  _syncBezi=true; nastavSyncStav("busy");
  let zmenaSys=false, prislo=0;
  try{
    for(let kolo=0;kolo<40;kolo++){
      const od=(await metaGet("kurzor"))||0;
      let fronta=(await dbAll("fronta"));
      // Šifrované věci se neposílají, dokud není klíč (bez klíče je ani nejde vytvořit).
      fronta=fronta.slice(0,300);
      const res=await api("/sync",{od,zmeny:fronta.map(f=>({store:f.store,rid:f.rid,data:f.data,updatedAt:f.updatedAt}))});
      for(const f of fronta){const now=await dbGet("fronta",f.id);if(now&&now.updatedAt===f.updatedAt) await dbDel("fronta",f.id);}
      if(res.odmitnuto&&res.odmitnuto.length){await metaSet("kurzor",0);toast("Server odmítl "+res.odmitnuto.length+" změn, data se načtou znovu.");}
      for(const z of res.zmeny){
        const loc=await dbGet(z.store,z.rid);
        const vFronte=await dbGet("fronta",z.store+"|"+z.rid);
        if(vFronte&&vFronte.updatedAt>z.updatedAt) continue;
        if(loc&&loc.updatedAt>z.updatedAt&&!(res.odmitnuto||[]).includes(z.store+"|"+z.rid)) continue;
        await dbPut(z.store,{id:z.rid,rid:z.rid,data:z.data,updatedAt:z.updatedAt});
        if(z.store==="sys") zmenaSys=true;
        prislo++;
      }
      await metaSet("kurzor",(res.odmitnuto&&res.odmitnuto.length)?0:res.verze);
      const zbyva=(await dbAll("fronta")).length;
      if(!res.vic&&!zbyva&&!(res.odmitnuto&&res.odmitnuto.length)) break;
      if(res.odmitnuto&&res.odmitnuto.length&&kolo>3) break;
    }
    await metaSet("posledniSync",Date.now());
    nastavSyncStav("ok");
    if(prislo){
      await nactiPamet();
      if(zmenaSys&&!KEY) await zkusOdemknout();
      if(!jeVPsani()) render();
      renderTabs();
    }
  }catch(e){
    nastavSyncStav("err",e.message);
    if(e.status===401){S.ja=null;render();}
  }finally{
    _syncBezi=false;
    if(_syncZnovu){_syncZnovu=false;naplanujSync(500);}
  }
}
function jeVPsani(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&$("#main").contains(a);}

async function zkusOdemknout(){
  const heslo=await metaGet("heslo");
  const sul=S.sys.get("sul"), kontrola=S.sys.get("kontrola");
  if(!heslo||!sul||!kontrola) return false;
  try{
    const k=await odvodKlic(heslo,sul.sul);
    const t=await rozsifruj(kontrola.enc,k);
    if(t!==KONTROLA) throw new Error();
    KEY=k; await rozsifrujVse(); return true;
  }catch(e){KEY=null;return false;}
}

/* ---------- vyhodnocení výkonu ---------- */
function evalVal(z,d,v,g,potvrzeno){
  if(v==null) return null; if(isNaN(v)) return {c:"chk",t:"Nečitelný výkon",necitelny:true};
  const D=DISC[d];
  const r=recOf(g,d,z.sex);
  if(!potvrzeno){
    if(v<D.min||v>D.max) return {c:"chk",t:"Zkontroluj výkon"};
    if(r&&r.v!=null&&(D.low? v<r.v*0.85 : v>r.v*1.15)) return {c:"chk",t:"Zkontroluj, je to daleko za rekordem"};
  }
  if(r&&r.v!=null&&better(v,r.v,d)) return {c:"rec",t:"Nový školní rekord"};
  const pb=best(vykonyZaka(z.id,d),d);
  if(!pb) return {c:"first",t:"První měření"};
  if(better(v,pb.v,d)) return {c:"pb",t:"Osobní rekord"};
  return null;
}

/* ---------- kartičky rekordů (vzhled Síně rekordů) ---------- */
const SYMB={M:"♂",F:"♀"};
const symH=sex=>sex==="X"?`<div class="sym X" aria-label="smíšená štafeta">4×</div>`:`<div class="sym ${sex}" aria-label="${sex==="M"?"kluci":"holky"}">${SYMB[sex]}</div>`;
const jeIso=dt=>!!dt&&/^\d{4}-\d\d-\d\d$/.test(dt);
const jeCerstvy=dt=>jeIso(dt)&&(Date.now()-Date.parse(dt))<=365*864e5;
const dtTxt=dt=>dt?(jeIso(dt)?datum(dt):dt):"";
const bezDia=s=>[...String(s||"")].map(ch=>ch.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()||ch).join("");
function zvyrazni(t,q){
  t=String(t||""); if(!q) return esc(t);
  const ch=[...t], i=bezDia(t).indexOf(bezDia(q)); if(i<0||bezDia(t).length!==ch.length) return esc(t);
  const n=[...bezDia(q)].length;
  return esc(ch.slice(0,i).join(""))+`<span class="hl">${esc(ch.slice(i,i+n).join(""))}</span>`+esc(ch.slice(i+n).join(""));
}
function recRow(g,d,sex,q){
  const r=recOf(g,d,sex), D=DISC[d];
  if(!r) return `<div class="rrow nic">${symH(sex)}<div class="who"><div class="n">Zatím bez rekordu. Kdo bude první?</div></div><div class="val">?</div></div>`;
  const jm=r.jm||"", casti=jm.split(/,\s*/);
  const who=d==="sta"&&casti.length===4?`<ul class="runners">${casti.map(x=>`<li>${zvyrazni(x,q)}</li>`).join("")}</ul>`:`<div class="n">${zvyrazni(jm||"bez jména",q)}</div>`;
  const meta=[r.tr,dtTxt(r.dt)].filter(Boolean).map(esc).join(" · ");
  return `<div class="rrow">${symH(sex)}<div class="who">${who}<div class="m">${meta}${jeCerstvy(r.dt)?'<span class="new">nový</span>':""}</div></div><div class="val num">${fmt(r.v,D.u)}</div></div>`;
}
function recCard(g,d,tag,foot){
  const smis=d==="sta"&&g<=5;
  return `<article class="card"><h3>${esc(dn(d,g))}<span>${tag!=null?tag:smis?"kluci a holky":""}</span></h3>${smis?recRow(g,d,"X"):recRow(g,d,"M")+recRow(g,d,"F")}${foot?`<div class="foot hint">${foot}</div>`:""}</article>`;
}

      <label class="f">Třída<select id="m-cls">${tridy.map(t=>`<option${t===st.cls?" selected":""}>${t}</option>`).join("")}</select></label>

function staTr(){const z0=S.zaci.get(S.mer.sta.cl[0]);return z0?(skolniRok(S.mer.date)-z0.coh+1)+"."+z0.pis:"";}
function dupStafeta(){
  const st=S.mer.sta, v=parseVal(st.cas,"sta"); if(v==null||isNaN(v)||!st.cl.every(Boolean)) return null;
  const klic=st.cl.slice().sort().join("|");

  return null;
}

}
function ulozeneStafety(g){

function evalStafeta(g){
  const st=S.mer.sta, v=parseVal(st.cas,"sta"); if(v==null) return null;
  if(isNaN(v)) return {c:"chk",t:"Nečitelný čas",necitelny:true};
  if(dupStafeta()) return {c:"chk",t:"Tahle štafeta se stejným časem už je uložená",necitelny:true,dup:true};
  const r=recOf(g,"sta",staSex(g,st.sex));
  if(!st.ok&&(v<DISC.sta.min||v>DISC.sta.max||(r&&v<r.v*0.85))) return {c:"chk",t:"Zkontroluj čas"};
  if(r&&v<r.v) return {c:"rec",t:"Nový školní rekord"};
  if(!r) return {c:"first",t:"Zatím bez rekordu"};
  return null;
}
function stafetaChips(g){
  const ev=evalStafeta(g); if(!ev) return "";
  const r=recOf(g,"sta",staSex(g,S.mer.sta.sex));
  if(ev.c==="chk"&&!ev.necitelny) return `<span class="chip chk">${ev.t}</span><button class="btn small ghost" id="st-ok">Je to správně</button>`;
  return `<span class="chip ${ev.c}">${ev.t}</span>`+(ev.c==="rec"?`<span class="hint">dosavadní rekord ${fmt(r.v,"s")}, půjde ke schválení</span>`:"");
}
function hotovoH(){const h=S.mer.hotovo;return h&&h.cls===S.mer.cls&&h.d===S.mer.d?`<div class="okbox" role="status"><b>✓ ${esc(h.nadpis)}</b>${h.radky.map(r=>`<p>${esc(r)}</p>`).join("")}</div>`:"";}

async function saveStafeta(){
  const st=S.mer, sta=st.sta, g=parseInt(st.cls), sy=skolniRok(st.date);
  const v=parseVal(sta.cas,"sta"), ev=evalStafeta(g);
  if(dupStafeta()){toast("Tahle štafeta už je uložená.");return;}
  if(v==null||isNaN(v)||(ev&&ev.c==="chk")){toast("Zkontroluj čas štafety.");return;}
  const z0=S.zaci.get(sta.cl[0]);
  const id=uid("v");
  const data={z:null,tym:sta.cl.slice(),d:"sta",v,g:sy-z0.coh+1,tr:(sy-z0.coh+1)+"."+z0.pis,sex:staSex(g,sta.sex),datum:st.date,t:Date.now()};
  await zapis("vykony",id,data); S.vykony.set(id,{...data,id,autor:S.ja&&S.ja.jmeno,autorId:S.ja&&S.ja.id});
  st.hotovo={cls:st.cls,d:"sta",nadpis:"Štafeta uložena",radky:[`${fmt(v,"s")}: ${sta.cl.map(id=>jmeno(S.zaci.get(id))).join(", ")}`,ev&&ev.c==="rec"?"Je to nový školní rekord, čeká na schválení.":"Najdeš ji v seznamu níž i v Přehledech."]};
  st.sta={sex:sta.sex,cl:["","","",""],cas:"",ok:false};
  renderTabs(); render();
  toast("Štafeta uložena"+(ev&&ev.c==="rec"?", rekord čeká na schválení.":"."));
}
function updateRow(id){
  const z=S.zaci.get(id), g=parseInt(S.mer.cls), v=parseVal(S.mer.inp[id]||"",S.mer.d), ev=evalVal(z,S.mer.d,v,g,S.mer.ok.has(id));
  $("#ch-"+id).innerHTML=chipsHtml(z,ev);
  $("#row-"+id).classList.toggle("isrec",!!(ev&&ev.c==="rec"));
  const n=filledCount(); $("#m-cnt").textContent=`${n} ${plural(n,"výkon","výkony","výkonů")} k uložení`; $("#m-save").disabled=!n;
}
async function saveMereni(){
  const st=S.mer, g=parseInt(st.cls); let n=0,recs=0,chk=0,dup=0; const jmena=[];
  const sy=skolniRok(st.date);
  for(const z of zaciTridy(st.cls)){
    const v=parseVal(st.inp[z.id]||"",st.d); if(v==null) continue;
    const ev=evalVal(z,st.d,v,g,st.ok.has(z.id));
    if(isNaN(v)||(ev&&ev.c==="chk")){chk++;continue;}
    if(vykonyZaka(z.id,st.d).some(x=>x.datum===st.date&&Math.abs(x.v-v)<0.001)){delete st.inp[z.id];dup++;continue;}
    if(ev&&ev.c==="rec") recs++;
    jmena.push(jmeno(z)+" "+fmt(v,DISC[st.d].u));
    const id=uid("v");
    const data={z:z.id,d:st.d,v,g:sy-z.coh+1,tr:(sy-z.coh+1)+"."+z.pis,sex:z.sex,datum:st.date,t:Date.now()};
    await zapis("vykony",id,data); S.vykony.set(id,{...data,id,autor:S.ja&&S.ja.jmeno,autorId:S.ja&&S.ja.id});
    delete st.inp[z.id]; st.ok.delete(z.id); n++;
  }
  st.hotovo=n||dup?{cls:st.cls,d:st.d,nadpis:n?`Uloženo: ${n} ${plural(n,"výkon","výkony","výkonů")}, ${dn(st.d,g)}, ${st.cls}`:"Nic nového k uložení",radky:[jmena.join(", ")||"",recs?`${recs} ${plural(recs,"nový rekord čeká","nové rekordy čekají","nových rekordů čeká")} na schválení.`:"",dup?`${dup} ${plural(dup,"výkon už byl","výkony už byly","výkonů už bylo")} uložen${dup===1?"ý":"é"} dřív, podruhé se nezapsal${dup===1?"":"y"}.`:"",chk?`${chk} ${plural(chk,"výkon zůstal","výkony zůstaly","výkonů zůstalo")} v poli ke kontrole.`:""].filter(Boolean)}:null;
  renderTabs(); render();
  toast(`Uloženo: ${n} ${plural(n,"výkon","výkony","výkonů")}`+(recs?`, ${recs} ${plural(recs,"rekord čeká","rekordy čekají","rekordů čeká")} na schválení`:"")+(chk?`. ${chk} ${plural(chk,"výkon zůstal","výkony zůstaly","výkonů zůstalo")} v poli ke kontrole.`:""));
}

/* ---------- Žáci ---------- */
function spark(vals,low){
  if(vals.length<2) return "";
  const W=200,H=40,p=5; let mn=Math.min(...vals),mx=Math.max(...vals); if(mx===mn){mx+=1;mn-=1;}
  const pts=vals.map((v,i)=>{const x=p+i*(W-2*p)/(vals.length-1);let r=(v-mn)/(mx-mn);if(low) r=1-r;return [x,H-p-r*(H-2*p)];});
  const L=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${W}" y1="${H-1}" y2="${H-1}" stroke="var(--line)"/><polyline points="${pts.map(q=>q.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${L[0]}" cy="${L[1]}" r="3.5" fill="var(--accent)"/></svg>`;
}
function rankIn(z,d){
  const sy=SY_NOW(), g=rocnik(z);
  const per=new Map();
  for(const v of S.vykony.values()) if(v.d===d&&v.g===g&&v.sex===z.sex&&skolniRok(v.datum)===sy){const b=per.get(v.z);if(!b||better(v.v,b.v,d)) per.set(v.z,v);}
  if(!per.has(z.id)) return null;
  const arr=[...per.values()].sort((a,b)=>DISC[d].low?a.v-b.v:b.v-a.v);
  return {pos:arr.findIndex(x=>x.z===z.id)+1,n:arr.length};
}
const smiMenit=v=>S.ja&&(S.ja.spravce||v.autorId===S.ja.id||!v.autorId);

      return `<article class="card dc"><h3>${esc(DISC[d].n)}<span class="num">${all.length} ${plural(all.length,"měření","měření","měření")}</span></h3><div class="cb">
        <div class="t"><span><span class="k">Osobní rekord</span><div class="v num">${fmt(b.v,D.u)}</div></span><span class="hint num" style="text-align:right">v ${b.g}. třídě<br>${datum(b.datum)}</span></div>
        ${spark(all.map(v=>v.v),D.low)}

        <details><summary>Všechna měření</summary><ul>${items}</ul></details></div></article>`;}).join("");
    const t=trida(z);
    $("#main").innerHTML=`<div style="margin-top:16px"><button class="back" id="z-back">‹ Zpět na seznam</button></div>

    <p class="hint" style="margin-top:8px">${list.length} ${plural(list.length,"žák","žáci","žáků")} · <label><input type="checkbox" id="z-stari"${st.stari?" checked":""}> i bývalí žáci</label></p>

    ${list.length>80?'<p class="hint">Zobrazeno prvních 80, zúži výběr třídou nebo jménem.</p>':""}`;
}

/* ---------- Přehledy ---------- */
function strip(groups,d){
  const D=DISC[d]; const vals=groups.flatMap(g=>g.vals); if(!vals.length) return "";
  let mn=Math.min(...vals),mx=Math.max(...vals); const pad=(mx-mn)*0.08||1; mn-=pad; mx+=pad;
  const W=340,L=42,Rr=10,rowH=50,H=groups.length*rowH+40;
  const X=v=>{let r=(v-mn)/(mx-mn); if(D.low) r=1-r; return L+r*(W-L-Rr);};
  const rows=groups.map((g,i)=>{const y=32+i*rowH; const mean=g.vals.reduce((a,b)=>a+b,0)/g.vals.length;
    return `<text x="0" y="${y+5}" font-size="14" font-weight="600" fill="var(--ink)">${esc(g.name)}</text>
      <line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)"/>
      ${g.vals.map(v=>`<circle cx="${X(v).toFixed(1)}" cy="${y}" r="5" fill="var(--accent)" fill-opacity=".45"/>`).join("")}
      <line x1="${X(mean).toFixed(1)}" x2="${X(mean).toFixed(1)}" y1="${y-11}" y2="${y+11}" stroke="var(--ink)" stroke-width="2.5"/>
      <text x="${Math.min(Math.max(X(mean),L+46),W-Rr-46).toFixed(1)}" y="${y-16}" font-size="12" text-anchor="middle" fill="var(--muted)">průměr ${fmt(rnd(mean,D.u),D.u)}</text>`;}).join("");
  const yb=groups.length*rowH+26;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rozložení výkonů podle tříd">${rows}
    <text x="${L}" y="${yb}" font-size="12" fill="var(--muted)">${fmt(rnd(D.low?mx:mn,D.u),D.u)} horší</text>

/* ---------- Rekordy ---------- */
function kandidati(){
  // nejlepší neschválený výkon v každé kategorii, který je lepší než rekord
  const best=new Map();
  for(const v of S.vykony.values()){
    if(v.zamitnuto||v.schvaleno||DISC[v.d].stara||!(GD[v.g]||[]).includes(v.d)) continue;
    const k=v.g+"|"+v.d+"|"+v.sex; const r=S.rekordy.get(k);
    if(r&&r.vykon===v.id) continue;
    if(r&&!better(v.v,r.v,v.d)) continue;
    const b=best.get(k); if(!b||better(v.v,b.v,v.d)) best.set(k,v);
  }
  return [...best.values()].sort((a,b)=>b.datum.localeCompare(a.datum));
}
function radekNastenka(v){return `Nový rekord: ${vykonJmeno(v)}, ${v.tr}, ${dn(v.d,v.g)}, ${fmt(v.v,DISC[v.d].u)}, ${datum(v.datum)}`;}

  $("#main").innerHTML=`<h1>Rekordy</h1>${ovladani}${hlava}

async function schvalit(vid){
  const v=S.vykony.get(vid); if(!v||!KEY) return;
  const jm=vykonJmeno(v);
  const k=v.g+"|"+v.d+"|"+v.sex;
  const rec={g:v.g,d:v.d,sex:v.sex,v:v.v,z:v.z||null,enc:await zasifruj({jm}),tr:v.tr,dt:v.datum,zdroj:"appka",vykon:v.id};
  await zapis("rekordy",k,rec); S.rekordy.set(k,{...rec,jm});
  const nv={...cistyVykon(v),schvaleno:true}; await zapis("vykony",vid,nv); S.vykony.set(vid,{...v,schvaleno:true});
  renderTabs(); render(); toast("Schváleno. Řádek pro nástěnku najdeš níž.");
}
async function zamitnout(vid){
  const v=S.vykony.get(vid); if(!v) return; const nv={...cistyVykon(v),zamitnuto:true};
  await zapis("vykony",vid,nv); S.vykony.set(vid,{...v,zamitnuto:true}); renderTabs(); render(); toast("Zamítnuto, výkon zůstává u žáka.");
}

function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>ok(window.XLSX);s.onerror=()=>ko(new Error("Knihovnu pro Excel nejde stáhnout, zkontroluj internet."));document.head.appendChild(s);});
}
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"";
  const sep=[";",",","\t"].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; continue; }
    if(c==='"') q=true; else if(c===sep){row.push(cell);cell="";} else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";} else if(c!=="\r") cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
async function nactiTabulku(file){
  if(/\.xlsx?$/i.test(file.name)){
    const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]]; return X.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  }
  const buf=await file.arrayBuffer();
  let text=new TextDecoder("utf-8").decode(buf);
  if(text.includes("�")) text=new TextDecoder("windows-1250").decode(buf);
  return parseCSV(text);
}
const RIM={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9};
function parseTrida(s){
  s=String(s||"").trim().toUpperCase().replace(/\s+/g," ");
  let m=s.match(/^(IX|VIII|VII|VI|IV|V|III|II|I)\s*\.?\s*([A-Z])\b/); if(m) return {g:RIM[m[1]],pis:m[2]};
  m=s.match(/^([1-9])\s*\.?\s*([A-Z])\b/); if(m) return {g:+m[1],pis:m[2]};
  return null;
}
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
function hadejPohlavi(prijmeni,jmeno){
  const p=String(prijmeni).trim().toLowerCase();
  if(/(ová|ova|á)$/.test(p)) return "F";
  const j=String(jmeno).trim().toLowerCase();
  if(/(a|e|ie)$/.test(j)&&!/^(jirka|honza|nikola|sasha|saša|luca|ilja|ilya|jona)$/.test(j)) return /(ý|ský|ck[ýy])$/.test(p)?"M":"F";
  return "M";
}
function rozpoznejSloupce(rows){
  // najdi řádek s hlavičkou v prvních 10 řádcích
  for(let i=0;i<Math.min(10,rows.length);i++){
    const h=rows[i].map(norm);
    const f=k=>h.findIndex(x=>k.some(kk=>x===kk||x.startsWith(kk)));
    const tr=f(["trida","class","skupina"]), pr=f(["prijmeni","surname"]), jm=f(["jmeno","krestni","name"]), po=f(["pohlavi","sex"]), cele=f(["zak","jmenoaprijmeni","prijmeniajmeno","zaci"]);
    if(tr>=0&&((pr>=0&&jm>=0&&pr!==jm)||cele>=0)) return {i,tr,pr,jm:jm===pr?-1:jm,po,cele};
  }
  return null;
}

function mapDisc(label){
  const s=String(label).toLowerCase();
  if(s.includes("tafeta")) return "sta";
  if(/^\s*60\s*m/.test(s)) return "d60"; if(/^\s*200\s*m/.test(s)) return "d200"; if(/^\s*400\s*m/.test(s)) return "d400";
  if(/^\s*500\s*m/.test(s)) return "d500"; if(/^\s*1000\s*m/.test(s)) return "d1000";
  if(s.includes("místa")) return "zm"; if(s.includes("dalek")) return "dal"; if(s.includes("vysok")) return "vys";
  if(s.includes("raketk")) return "rak"; if(s.includes("míčk")) return "mic"; if(s.includes("koul")) return "kou"; if(s.includes("šplh")) return "spl";
  return undefined;
}
function hodnotaDatumu(c){
  if(!c) return "";
  if(c.t==="d"||c.v instanceof Date){const d=c.v instanceof Date?c.v:new Date(c.v);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  return String(c.w||c.v||"").trim();
}
async function importRekordu(file){

function najdiZaka(text,tr){

/* ---------- import výkonů z tabulky ---------- */
function parseDatum(x){
  x=String(x||"").trim(); let m=x.match(/^(\d{4})-(\d\d)-(\d\d)/); if(m) return m[1]+"-"+m[2]+"-"+m[3];
  m=x.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{2,4})$/); if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");}
  return null;
}
async function importVykonu(file){
  const out=$("#n-vyk-out"); out.innerHTML='<p class="hint">Načítám…</p>';

    const c={dt:col(["datum"]),tr:col(["trida"]),p:col(["prijmeni"]),j:col(["jmeno"]),d:col(["disciplin"]),v:col(["vykon"])};
    const ok=[],chyby=[];

      const d=mapDisc(r[c.d]); const datum=parseDatum(r[c.dt]);

      const sy=skolniRok(datum), g=sy-z.coh+1;
      const ev=evalVal(z,d,v,g);
      if(ev&&ev.c==="chk"){chyby.push(popis+" (podezřelá hodnota, zkontroluj a zapiš ručně)");continue;}
      if([...S.vykony.values(),...ok].some(x=>x.z===z.id&&x.d===d&&x.v===v&&x.datum===datum)) continue;
      ok.push({z:z.id,d,v,g,tr:g+"."+z.pis,sex:z.sex,datum,zdroj:"import",t:Date.now()});
    }
    S._importVyk=ok;
    out.innerHTML=`<p style="margin-top:10px"><b>${ok.length} ${plural(ok.length,"výkon","výkony","výkonů")}</b> připraveno k uložení.</p>
      ${chyby.length?`<p class="hint">Vynechám ${chyby.length}:</p><ul class="hint" style="margin:0 0 8px;padding-left:18px">${chyby.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      ${ok.length?'<div class="btns"><button class="btn" id="n-vyk-ok">Uložit výkony</button></div>':""}`;
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message)}</p>`;}
}
async function ulozitVykony(){
  const list=S._importVyk; if(!list) return;
  for(const data of list){const id=uid("v");await zapis("vykony",id,data);S.vykony.set(id,{...data,id,autor:S.ja&&S.ja.jmeno,autorId:S.ja&&S.ja.id});}
  S._importVyk=null; renderTabs(); render(); toast(`Uloženo ${list.length} ${plural(list.length,"výkon","výkony","výkonů")}.`);
}

/* ---------- export ---------- */
function exportCSV(){
  const rows=[["datum","třída","příjmení","jméno","pohlaví","disciplína","výkon","jednotka","zapsal"]];
  const all=[...S.vykony.values()].sort((a,b)=>a.datum.localeCompare(b.datum));
  for(const v of all){const z=v.tym?{p:vykonJmeno(v),j:""}:(S.zaci.get(v.z)||{});const D=DISC[v.d];rows.push([v.datum,v.tr,z.p||"",z.j||"",v.sex==="M"?"chlapec":v.sex==="F"?"dívka":"smíšená",dn(v.d,v.g),D.u==="min"?fmt(v.v,"min").replace(" min",""):cz(v.v),D.u,v.autor||""]);}
  const csv="﻿"+rows.map(r=>r.map(x=>{x=String(x);return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="rekordnik-vykony-"+dnes()+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

/* ---------- navigace ---------- */
const ICON={
 mereni:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 3h4M18.5 6.5l1.5-1.5"/></svg>',
 zaci:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg>',
 prehledy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9M3 20.5h18"/></svg>',
 rekordy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="15" r="5.5"/><path d="M8.5 10.5L6 3h4l2 5 2-5h4l-2.5 7.5"/></svg>'};
const TABS=[["mereni","Měření"],["zaci","Žáci"],["prehledy","Přehledy"],["rekordy","Rekordy"]];
function renderTabs(){
  const pripraveno=S.ja&&KEY;
  $("#nav").hidden=!pripraveno;
  const k=pripraveno?kandidati().length:0;
  $("#tabs").innerHTML=TABS.map(([id,t])=>`<button data-tab="${id}"${S.tab===id?' aria-current="page"':""}>${ICON[id]}${t}${id==="rekordy"&&k?`<span class="badge num">${k}</span>`:""}</button>`).join("");
  $("#btnNast").setAttribute("aria-current",S.tab==="nastaveni"?"page":"false");
}
function render(){
  if(!(S.ja&&KEY)&&S.tab!=="nastaveni") S.tab="nastaveni";
  $("#main").className=(S.tab==="rekordy"||(S.tab==="zaci"&&S.zaci_ui.kid))?"":"narrow";
  ({mereni:renderMereni,zaci:renderZaci,prehledy:renderPrehledy,rekordy:renderRekordy,nastaveni:renderNastaveni})[S.tab]();
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;S.tab=b.dataset.tab;renderTabs();render();scrollTo(0,0);});
$("#btnNast").addEventListener("click",()=>{S.tab=S.tab==="nastaveni"&&S.ja&&KEY?"mereni":"nastaveni";renderTabs();render();scrollTo(0,0);});
const M=$("#main");
M.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="m-cls"){S.mer.cls=t.value;S.mer.inp={};S.mer.ok.clear();metaSet("prefs",{cls:S.mer.cls,d:S.mer.d});render();}
  else if(t.id==="m-d"){S.mer.d=t.value;S.mer.inp={};S.mer.ok.clear();metaSet("prefs",{cls:S.mer.cls,d:S.mer.d});render();}
  else if(t.id==="m-date"){S.mer.date=t.value||dnes();}
  else if(t.dataset.clen!=null){S.mer.sta.cl[+t.dataset.clen]=t.value;render();}
  else if(t.id==="z-cls"){S.zaci_ui.cls=t.value;render();}
  else if(t.id==="z-stari"){S.zaci_ui.stari=t.checked;render();}
  else if(t.id==="p-g"){S.pre.g=+t.value;render();}
  else if(t.id==="p-d"){S.pre.d=t.value;render();}
  else if(t.id==="p-sy"){S.pre.sy=+t.value;render();}
  else if(t.id==="n-zaci"&&t.files[0]) importZaku(t.files[0]);
  else if(t.id==="n-rek"&&t.files[0]) importRekordu(t.files[0]);
  else if(t.id==="n-vyk"&&t.files[0]) importVykonu(t.files[0]);
});
M.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.kid){if(S.mer.hotovo){S.mer.hotovo=null;const b=M.querySelector(".okbox");if(b)b.remove();}S.mer.inp[t.dataset.kid]=t.value;S.mer.ok.delete(t.dataset.kid);updateRow(t.dataset.kid);}
  else if(t.id==="st-cas"){S.mer.sta.cas=t.value;S.mer.sta.ok=false;const g=parseInt(S.mer.cls);$("#st-chips").innerHTML=stafetaChips(g);const v=parseVal(t.value,"sta");const sta=S.mer.sta;$("#st-save").disabled=!(sta.cl.every(Boolean)&&new Set(sta.cl).size===4&&v!=null&&!isNaN(v));}
  else if(t.id==="r-q"){S.rek.q=t.value;const pos=t.selectionStart;render();const n=$("#r-q");n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}
  else if(t.id==="z-q"){S.zaci_ui.q=t.value;const pos=t.selectionStart;render();const n=$("#z-q");n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}
});
M.addEventListener("keydown",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.kid&&e.key==="Enter"){e.preventDefault();const ins=[...M.querySelectorAll(".inp")];const i=ins.indexOf(t);if(ins[i+1]) ins[i+1].focus(); else t.blur();}
  if(t.id==="n-kod"&&e.key==="Enter") prihlasit();
  if(t.id==="n-heslo"&&e.key==="Enter") odemknout();
});
let _delArm=null;
M.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  try{
  if(t.id==="m-save") await saveMereni();
  else if(t.id==="st-save") await saveStafeta();
  else if(t.id==="st-ok"){S.mer.sta.ok=true;$("#st-chips").innerHTML=stafetaChips(parseInt(S.mer.cls));}
  else if(t.dataset.stsex){S.mer.sta.sex=t.dataset.stsex;S.mer.sta.cl=["","","",""];render();}
  else if(t.dataset.okv){S.mer.ok.add(t.dataset.okv);updateRow(t.dataset.okv);}
  else if(t.dataset.open){S.zaci_ui.kid=t.dataset.open;render();scrollTo(0,0);}
  else if(t.id==="z-back"){S.zaci_ui.kid=null;render();}
  else if(t.dataset.sex) await zmenitPohlavi(t.dataset.sex);
  else if(t.dataset.delv){
    if(_delArm!==t.dataset.delv){_delArm=t.dataset.delv;t.textContent="Opravdu smazat?";t.classList.add("warn");return;}
    _delArm=null; const id=t.dataset.delv; await zapis("vykony",id,null); S.vykony.delete(id); S.mer.hotovo=null; renderTabs(); render(); toast("Smazáno.");
  }
  else if(t.dataset.psex){S.pre.sex=t.dataset.psex;render();}
  else if(t.dataset.rg){S.rek.g=+t.dataset.rg;const f=t.classList.contains("fcard");if(f) S.rek.q="";render();if(f){const sec=$("#gradeSec");if(sec) sec.scrollIntoView({behavior:"smooth",block:"start"});}}
  else if(t.dataset.pg){S.pre.g=+t.dataset.pg;render();}
  else if(t.dataset.appr) await schvalit(t.dataset.appr);
  else if(t.dataset.rej) await zamitnout(t.dataset.rej);
  else if(t.id==="r-copy"){const txt=[...M.querySelectorAll(".panel p.num")].map(p=>p.textContent).join("\n");try{await navigator.clipboard.writeText(txt);toast("Zkopírováno.");}catch(_){toast("Kopírování nejde, označ text ručně.");}}
  else if(t.id==="n-login") await prihlasit();
  else if(t.id==="n-zalozit") await zalozitHeslo();
  else if(t.id==="n-odemknout") await odemknout();
  else if(t.id==="n-znovu"){await syncNow();render();}
  else if(t.id==="n-logout"){if(t.dataset.arm){await odhlasit();}else{t.dataset.arm="1";t.textContent="Opravdu? Neodeslané změny se ztratí";t.classList.add("warn");}}
  else if(t.id==="n-zaci-ok") await ulozitZaky();
  else if(t.id==="n-rek-ok") await ulozitRekordy();
  else if(t.id==="n-vyk-ok") await ulozitVykony();
  else if(t.id==="n-export") exportCSV();
  else if(t.id==="n-push-on") await pushZapnout();
  else if(t.id==="n-push-off") await pushVypnout();
  else if(t.id==="n-push-test"){await api("/push/test",{endpoint:PUSH.endpoint});toast("Odesláno, za chvilku by mělo přijít.");}
  else if(t.id==="n-sync"){await syncNow();toast(S.syncStav==="ok"?"Synchronizováno.":"Synchronizace selhala: "+S.syncChyba);}
  else if(t.id==="n-uc-load"){await nactiUcitele();render();}
  else if(t.id==="n-uc-add"){const jm=$("#n-uc-jm").value.trim();if(!jm){toast("Napiš jméno.");return;}const k=await novyKodData();const r=await api("/ucitele",{akce:"pridat",jmeno:jm,kod_hash:k.kod_hash,kod_enc:k.kod_enc});S.sprava.kody[r.id]=k.kod;await nactiUcitele();render();toast("Učitel přidán, kód je u jeho jména.");}
  else if(t.dataset.ucshow){const x=S.sprava.ucitele.find(u=>u.id===t.dataset.ucshow);try{S.sprava.kody[x.id]=await rozsifruj(x.kod_enc);}catch(_){toast("Kód nejde rozšifrovat, vytvoř nový.");return;}render();}
  else if(t.dataset.ucnew){const k=await novyKodData();await api("/ucitele",{akce:"novy-kod",id:t.dataset.ucnew,kod_hash:k.kod_hash,kod_enc:k.kod_enc});S.sprava.kody[t.dataset.ucnew]=k.kod;await nactiUcitele();render();toast("Nový kód je platný, starý už ne.");}
  else if(t.dataset.ucdel){const id=t.dataset.ucdel;if(S.sprava.smazArm!==id){S.sprava.smazArm=id;render();return;}S.sprava.smazArm=null;await api("/ucitele",{akce:"smazat",id});delete S.sprava.kody[id];await nactiUcitele();render();toast("Učitel smazán. Jeho dřívější zápisy zůstávají.");}
  else if(t.dataset.uc){await api("/ucitele",{akce:t.dataset.uc,id:t.dataset.id});await nactiUcitele();render();}
  else if(t.dataset.ucmsg){const txt=zpravaKolegovi(S.sprava.kody[t.dataset.ucmsg]);try{await navigator.clipboard.writeText(txt);toast("Zpráva zkopírovaná.");}catch(_){toast("Kopírování nejde, opiš kód ručně.");}}
  }catch(err){toast(err.message||String(err));}
});

/* ---------- service worker a aktualizace ---------- */
let _reg=null;
function regUpdate(){if(_reg) _reg.update().catch(()=>{});}
if("serviceWorker" in navigator&&location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    _reg=reg;
    const hlasit=w=>{if(!w)return;w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller) $("#upd").hidden=false;});};
    if(reg.waiting&&navigator.serviceWorker.controller) $("#upd").hidden=false;
    reg.addEventListener("updatefound",()=>hlasit(reg.installing));
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload();});
  $("#updBtn").addEventListener("click",()=>{if(_reg&&_reg.waiting) _reg.waiting.postMessage("skip"); else location.reload();});
}

start().catch(e=>{$("#main").innerHTML=`<div class="panel"><p class="err">Appka nejde spustit: ${esc(e.message)}</p></div>`;});
</script>
