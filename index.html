<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rekordník</title>
<meta name="theme-color" content="#12715A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rekordník">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Telefonní appka v jednom sloupci, dole lišta se čtyřmi záložkami, nahoře pruh jako čáry atletické dráhy */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#15211B; --muted:#5A6A62; --line:#DAE2DC;
  --accent:#12715A; --accent-soft:#E0F0E9; --on-accent:#FFFFFF;
  --gold:#A87405; --gold-soft:#FBF0D3; --warn:#B0501A; --warn-soft:#FBE8DB;
  --boys:#2D6CB0; --girls:#B8447A;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1412; --surface:#16201C; --ink:#E5EDE8; --muted:#93A39B; --line:#28342F;
  --accent:#4CC39A; --accent-soft:#16392D; --on-accent:#08130F;
  --gold:#E3B547; --gold-soft:#3A2E10; --warn:#F08A55; --warn-soft:#3C2116;
  --boys:#7DB2EE; --girls:#EE8DB8; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding:env(safe-area-inset-top,0px) 16px 0;-webkit-text-size-adjust:100%}
.app{max-width:560px;margin:0 auto;padding-bottom:110px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
header.top{padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topr{display:flex;align-items:center;gap:8px}
.syncdot{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.syncdot i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.syncdot.ok i{background:var(--accent)} .syncdot.err i{background:var(--warn)} .syncdot.busy i{background:var(--gold)}
.iconbtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:focus-visible{outline:2px solid var(--accent)}
.iconbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.iconbtn svg{width:24px;height:24px}
.lanes{height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,transparent 28px 34px);opacity:.85;border-radius:3px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:4px 0 12px}
h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:24px 0 10px;color:var(--muted)}
p{margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
select,input[type=date],input[type=search],input[type=text],input[type=password],input[type=url]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.panel+.panel{margin-top:10px}
.recbar{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.recbar div{flex:1 1 120px}
.k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.v{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--warn);font-weight:600}
.list{display:flex;flex-direction:column;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kid{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding:10px 14px;border-top:1px solid var(--line)}
.kid:first-child{border-top:0}
.kid .nm{font-weight:600;min-width:0}
.kid .sub{font-size:13px;color:var(--muted)}
.kid .chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kid .chips:empty{display:none}
.kid.isrec{background:var(--gold-soft)}
.sx{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.sx.M{background:var(--boys)} .sx.F{background:var(--girls)}
.inp{font:inherit;font-family:var(--display);font-size:24px;font-weight:600;width:112px;text-align:right;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.inp::placeholder{color:var(--muted);opacity:.5;font-weight:500}
.chip{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.chip.pb{background:var(--accent-soft);color:var(--accent)}
.chip.rec{background:var(--gold);color:var(--surface)}
.chip.chk{background:var(--warn-soft);color:var(--warn)}
.chip.first{background:var(--line);color:var(--muted)}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--warn);color:#fff}
.btn.small{font-size:14px;padding:8px 12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.08);z-index:3}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{font:inherit;font-size:13px;font-weight:600;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;cursor:pointer;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--gold);color:var(--surface);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.kidbtn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.kidbtn:first-child{border-top:0}
.kidbtn:hover{background:var(--bg)}
.kidbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kidbtn .cl{font-family:var(--display);font-weight:600;color:var(--muted);font-size:18px;align-self:center}
.back{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dc .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dc .t b{font-weight:600}
.dc svg{width:100%;height:40px;display:block}
.dc details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.dc ul{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
.dc li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line);align-items:center}
.rank{font-size:13px;color:var(--accent);font-weight:600}
.lb{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lbr{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.lbr:first-child{border-top:0}
.pos{font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted);text-align:center}
.lbr.p1 .pos{color:var(--gold)}
.lbr .val{font-family:var(--display);font-size:20px;font-weight:600}
.up{color:var(--accent);font-weight:600}
.strip svg{width:100%;height:auto;display:block}
.empty{padding:18px 14px;color:var(--muted);font-size:15px}
.rt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.rt th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.rt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.rt tr:last-child td{border-bottom:0}
.rt td.rv{font-family:var(--display);font-size:19px;font-weight:600;white-space:nowrap}
.rt td.rv .who{font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);white-space:normal}
.rt td.rv.new{color:var(--gold)}
.rt td.none{color:var(--muted);font-size:14px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.gradechips{display:flex;gap:6px;flex-wrap:wrap}
.gradechips button{font:inherit;font-family:var(--display);font-size:18px;font-weight:600;min-width:42px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.gradechips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.appr{background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.appr .big{font-family:var(--display);font-size:24px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:9;max-width:calc(100% - 32px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:15px;font-weight:600;border:0;background:none;color:var(--muted);padding:9px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:600;letter-spacing:.06em;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;user-select:all;word-break:break-all}
.upd{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:8;font-weight:600}
.upd button{font:inherit;font-weight:700;border:0;background:var(--on-accent);color:var(--accent);border-radius:8px;padding:6px 12px;cursor:pointer}
.ul{display:flex;flex-direction:column;gap:8px}
.ul .u{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>Rekordník</b><span id="kdo">TV · ZŠ Mendelova</span></div>
    <div class="topr">
      <span class="syncdot" id="syncdot" title="Synchronizace"><i></i><span id="synctext"></span></span>
      <button class="iconbtn" id="btnNast" aria-label="Nastavení"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <div class="lanes" aria-hidden="true"></div>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Hlavní menu" id="nav"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>
<div class="upd" id="upd" hidden><span>Je k dispozici nová verze.</span><button id="updBtn">Načíst</button></div>

<script>
"use strict";
/* ==========================================================================
   Rekordník · společná evidence výkonů v TV, ZŠ Mendelova
   Verze se zvyšuje spolu s CACHE v sw.js.
   ========================================================================== */
const VERZE = "1.0.0";
// Adresa Workeru po nasazení. Prázdná = zadává se v Nastavení.
const VYCHOZI_SERVER = "https://rekordnik.chuanito-bonito.workers.dev";

/* ---------- disciplíny (dohoda kolektivu 13. 10. 2026) ---------- */
const DISC = {
  d60:{n:"60 m",u:"s",low:true,min:6,max:20},
  d200:{n:"200 m",u:"s",low:true,min:22,max:80},
  d400:{n:"400 m",u:"min",low:true,min:50,max:200},
  d500:{n:"500 m",u:"min",low:true,min:70,max:260},
  d1000:{n:"1000 m",u:"min",low:true,min:150,max:600},
  zm:{n:"Skok z místa",u:"cm",low:false,min:50,max:350},
  dal:{n:"Skok daleký",u:"cm",low:false,min:100,max:700},
  vys:{n:"Skok vysoký",u:"cm",low:false,min:50,max:220},
  rak:{n:"Hod raketkou",u:"m",low:false,min:2,max:90},
  kou:{n:"Vrh koulí",u:"m",low:false,min:1,max:20},
  spl:{n:"Šplh",u:"s",low:true,min:2,max:40},
  mic:{n:"Hod míčkem (do 2025/26)",u:"m",low:false,min:2,max:90,stara:true}
};
const PET="Vrh petanque koulí", K3="Vrh koulí 3 kg", K34="Vrh koulí (holky 3 kg, kluci 4 kg)";
const NAME_OVR={1:{spl:"Šplh 1/2 tyče",kou:PET},2:{kou:PET},3:{kou:PET},4:{kou:PET},5:{kou:PET},6:{kou:K3},7:{kou:K3},8:{kou:K34},9:{kou:K34}};
const dn=(d,g)=>(NAME_OVR[g]&&NAME_OVR[g][d])||DISC[d].n;
const GD={};
for(let g=1;g<=9;g++){
  GD[g]=["d60","d200","d400",(g>=2&&g<=4)?"d500":"d1000","zm","dal","vys","rak","kou","spl"];
}
const better=(a,b,d)=>DISC[d].low?a<b:a>b;

/* ---------- pomocné ---------- */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cz=n=>String(n).replace(".",",");
const plural=(n,a,b,c)=>n===1?a:(n>=2&&n<=4?b:c);
const dnes=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const datum=iso=>{if(!iso)return "";const [y,m,d]=iso.split("-");return (+d)+". "+(+m)+". "+y;};
const skolniRok=iso=>{const y=+iso.slice(0,4),m=+iso.slice(5,7);return m>=9?y:y-1;};
const syLabel=sy=>sy+"/"+String(sy+1).slice(2);
const pololeti=iso=>{const m=+iso.slice(5,7);return (m>=9||m===1)?"podzim":"jaro";};
const uid=p=>p+"_"+[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join("");
function rnd(v,u){return u==="s"||u==="m"?Math.round(v*100)/100:u==="min"?Math.round(v*10)/10:Math.round(v);}
function fmt(v,u){
  if(v==null||isNaN(v)) return "";
  if(u==="s") return cz(v.toFixed(2))+" s";
  if(u==="m") return cz(v.toFixed(2))+" m";
  if(u==="cm") return Math.round(v)+" cm";
  const m=Math.floor(v/60),s=v-m*60;return m+":"+cz(s.toFixed(1).padStart(4,"0"))+" min";
}
function parseVal(str,d){
  if(str==null||!String(str).trim()) return null;
  let t=String(str).trim().replace(/\s*(min|cm|s|m)\.?$/i,"").replace(/,/g,".").replace(/\s+/g,"");
  let v;
  if(t.includes(":")){const p=t.split(":");v=(+p[0])*60+(+p[1]);} else v=+t;
  if(!isFinite(v)||v<=0) return NaN;
  if(DISC[d].u==="cm"&&v<10) v=v*100;
  return rnd(v,DISC[d].u);
}
const PH={s:"8,45",min:"1:13,5",cm:"185",m:"24,50"};
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2800);}
const b64=u8=>{let s="";u8.forEach(b=>s+=String.fromCharCode(b));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

/* ---------- IndexedDB ---------- */
const DBNAME="rekordnik", DBVER=1;
const STORES=["meta","zaci","vykony","rekordy","sys","fronta"];
let _db;
function dbOpen(){
  return new Promise((ok,ko)=>{
    const r=indexedDB.open(DBNAME,DBVER);
    r.onupgradeneeded=()=>{const db=r.result;for(const s of STORES) if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:s==="meta"?"k":"id"});};
    r.onsuccess=()=>{_db=r.result;ok(_db);};
    r.onerror=()=>ko(r.error);
  });
}
function tx(store,mode,fn){
  return new Promise((ok,ko)=>{
    const t=_db.transaction(store,mode);const st=t.objectStore(store);let res;
    const r=fn(st); if(r&&"onsuccess" in r) r.onsuccess=()=>{res=r.result;};
    t.oncomplete=()=>ok(res); t.onerror=()=>ko(t.error); t.onabort=()=>ko(t.error);
  });
}
const dbAll=s=>tx(s,"readonly",st=>st.getAll());
const dbGet=(s,k)=>tx(s,"readonly",st=>st.get(k));
const dbPut=(s,v)=>tx(s,"readwrite",st=>st.put(v));
const dbDel=(s,k)=>tx(s,"readwrite",st=>st.delete(k));
const dbClear=s=>tx(s,"readwrite",st=>st.clear());
function dbPutMany(s,list){return new Promise((ok,ko)=>{const t=_db.transaction(s,"readwrite");const st=t.objectStore(s);for(const v of list) st.put(v);t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);});}
const metaGet=async k=>{const r=await dbGet("meta",k);return r?r.v:undefined;};
const metaSet=(k,v)=>dbPut("meta",{k,v});

/* ---------- šifrování (heslo kolektivu) ---------- */
let KEY=null;
async function odvodKlic(heslo,sulB64){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(heslo),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(sulB64),iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function zasifruj(obj,key=KEY){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return b64(out);
}
async function rozsifruj(s,key=KEY){
  const u=unb64(s);const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
const KONTROLA="rekordnik-ok";

/* ---------- stav v paměti ---------- */
const S={
  tab:"mereni", ja:null, server:"", kod:"", syncStav:"", syncChyba:"",
  zaci:new Map(),       // id -> {id,j,p,pis,coh,sex,akt}
  rawZaci:[],           // záznamy, které ještě nejdou rozšifrovat

  rek:{g:6},

const SY_NOW=()=>skolniRok(dnes());
const rocnik=(z,sy=SY_NOW())=>sy-z.coh+1;
const trida=(z,sy=SY_NOW())=>{const g=rocnik(z,sy);return g>=1&&g<=9?g+"."+z.pis:null;};
const jmeno=z=>z?(z.j+" "+z.p):"neznámý žák";
const byName=(a,b)=>a.p.localeCompare(b.p,"cs")||a.j.localeCompare(b.j,"cs");

function vykonyZaka(id,d){const out=[];for(const v of S.vykony.values()) if(v.z===id&&(!d||v.d===d)) out.push(v);return out.sort((a,b)=>a.datum.localeCompare(b.datum)||(a.t||0)-(b.t||0));}
function best(list,d){let b=null;for(const v of list) if(!b||better(v.v,b.v,d)) b=v;return b;}

async function nactiPamet(){

  S.sys=new Map((await dbAll("sys")).filter(x=>x.data).map(x=>[x.rid,x.data]));

}
async function rozsifrujVse(){
  S.zaci=new Map(); S.rekordy=new Map(); S.rawZaci=[];
  const zr=(await dbAll("zaci")).filter(x=>x.data);
  const rr=(await dbAll("rekordy")).filter(x=>x.data);
  for(const x of zr){
    if(!KEY){S.rawZaci.push(x);continue;}
    try{S.zaci.set(x.rid,{...(await rozsifruj(x.data.enc)),id:x.rid});}catch(e){S.rawZaci.push(x);}
  }

/* ---------- synchronizace ---------- */
async function zapis(store,rid,data){
  const t=Date.now();
  const id=store+"|"+rid;
  await dbPut(store,{id:rid,rid,data,updatedAt:t});
  await dbPut("fronta",{id,store,rid,data,updatedAt:t});
  naplanujSync(2500);
}
async function api(cesta,telo,metoda){
  const r=await fetch(S.server.replace(/\/+$/,"")+cesta,{method:metoda||(telo?"POST":"GET"),headers:{"authorization":"Bearer "+S.kod,"content-type":"application/json"},body:telo?JSON.stringify(telo):undefined,cache:"no-store"});
  const j=await r.json().catch(()=>({chyba:"HTTP "+r.status}));
  if(!r.ok||j.chyba){const e=new Error(j.chyba||("HTTP "+r.status));e.status=r.status;throw e;}
  return j;
}
let _syncT=null,_syncBezi=false,_syncZnovu=false;
function naplanujSync(ms){clearTimeout(_syncT);_syncT=setTimeout(syncNow,ms);}
function nastavSyncStav(s,chyba){S.syncStav=s;S.syncChyba=chyba||"";const el=$("#syncdot");el.className="syncdot "+(s==="ok"?"ok":s==="err"?"err":s==="busy"?"busy":"");$("#synctext").textContent=s==="err"?"offline":s==="busy"?"…":"";el.title=chyba||"Synchronizace";}
async function syncNow(){
  if(!S.server||!S.kod) return;
  if(_syncBezi){_syncZnovu=true;return;}
  _syncBezi=true; nastavSyncStav("busy");
  let zmenaSys=false, prislo=0;
  try{
    for(let kolo=0;kolo<40;kolo++){
      const od=(await metaGet("kurzor"))||0;
      let fronta=(await dbAll("fronta"));
      // Šifrované věci se neposílají, dokud není klíč (bez klíče je ani nejde vytvořit).
      fronta=fronta.slice(0,300);
      const res=await api("/sync",{od,zmeny:fronta.map(f=>({store:f.store,rid:f.rid,data:f.data,updatedAt:f.updatedAt}))});
      for(const f of fronta){const now=await dbGet("fronta",f.id);if(now&&now.updatedAt===f.updatedAt) await dbDel("fronta",f.id);}
      if(res.odmitnuto&&res.odmitnuto.length){await metaSet("kurzor",0);toast("Server odmítl "+res.odmitnuto.length+" změn, data se načtou znovu.");}
      for(const z of res.zmeny){
        const loc=await dbGet(z.store,z.rid);
        const vFronte=await dbGet("fronta",z.store+"|"+z.rid);
        if(vFronte&&vFronte.updatedAt>z.updatedAt) continue;
        if(loc&&loc.updatedAt>z.updatedAt&&!(res.odmitnuto||[]).includes(z.store+"|"+z.rid)) continue;
        await dbPut(z.store,{id:z.rid,rid:z.rid,data:z.data,updatedAt:z.updatedAt});
        if(z.store==="sys") zmenaSys=true;
        prislo++;
      }
      await metaSet("kurzor",(res.odmitnuto&&res.odmitnuto.length)?0:res.verze);
      const zbyva=(await dbAll("fronta")).length;
      if(!res.vic&&!zbyva&&!(res.odmitnuto&&res.odmitnuto.length)) break;
      if(res.odmitnuto&&res.odmitnuto.length&&kolo>3) break;
    }
    await metaSet("posledniSync",Date.now());
    nastavSyncStav("ok");
    if(prislo){
      await nactiPamet();
      if(zmenaSys&&!KEY) await zkusOdemknout();
      if(!jeVPsani()) render();
      renderTabs();
    }
  }catch(e){
    nastavSyncStav("err",e.message);
    if(e.status===401){S.ja=null;render();}
  }finally{
    _syncBezi=false;
    if(_syncZnovu){_syncZnovu=false;naplanujSync(500);}
  }
}
function jeVPsani(){const a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&$("#main").contains(a);}

async function zkusOdemknout(){
  const heslo=await metaGet("heslo");
  const sul=S.sys.get("sul"), kontrola=S.sys.get("kontrola");
  if(!heslo||!sul||!kontrola) return false;
  try{
    const k=await odvodKlic(heslo,sul.sul);
    const t=await rozsifruj(kontrola.enc,k);
    if(t!==KONTROLA) throw new Error();
    KEY=k; await rozsifrujVse(); return true;
  }catch(e){KEY=null;return false;}
}

/* ---------- vyhodnocení výkonu ---------- */
function evalVal(z,d,v,g,potvrzeno){
  if(v==null) return null; if(isNaN(v)) return {c:"chk",t:"Nečitelný výkon",necitelny:true};
  const D=DISC[d];
  const r=recOf(g,d,z.sex);
  if(!potvrzeno){
    if(v<D.min||v>D.max) return {c:"chk",t:"Zkontroluj výkon"};
    if(r&&r.v!=null&&(D.low? v<r.v*0.85 : v>r.v*1.15)) return {c:"chk",t:"Zkontroluj, je to daleko za rekordem"};
  }
  if(r&&r.v!=null&&better(v,r.v,d)) return {c:"rec",t:"Nový školní rekord"};
  const pb=best(vykonyZaka(z.id,d),d);
  if(!pb) return {c:"first",t:"První měření"};
  if(better(v,pb.v,d)) return {c:"pb",t:"Osobní rekord"};
  return null;
}

/* ---------- Žáci ---------- */
function spark(vals,low){
  if(vals.length<2) return "";
  const W=200,H=40,p=5; let mn=Math.min(...vals),mx=Math.max(...vals); if(mx===mn){mx+=1;mn-=1;}
  const pts=vals.map((v,i)=>{const x=p+i*(W-2*p)/(vals.length-1);let r=(v-mn)/(mx-mn);if(low) r=1-r;return [x,H-p-r*(H-2*p)];});
  const L=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${W}" y1="${H-1}" y2="${H-1}" stroke="var(--line)"/><polyline points="${pts.map(q=>q.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${L[0]}" cy="${L[1]}" r="3.5" fill="var(--accent)"/></svg>`;
}
function rankIn(z,d){
  const sy=SY_NOW(), g=rocnik(z);
  const per=new Map();
  for(const v of S.vykony.values()) if(v.d===d&&v.g===g&&v.sex===z.sex&&skolniRok(v.datum)===sy){const b=per.get(v.z);if(!b||better(v.v,b.v,d)) per.set(v.z,v);}
  if(!per.has(z.id)) return null;
  const arr=[...per.values()].sort((a,b)=>DISC[d].low?a.v-b.v:b.v-a.v);
  return {pos:arr.findIndex(x=>x.z===z.id)+1,n:arr.length};
}

/* ---------- Přehledy ---------- */
function strip(groups,d){
  const D=DISC[d]; const vals=groups.flatMap(g=>g.vals); if(!vals.length) return "";
  let mn=Math.min(...vals),mx=Math.max(...vals); const pad=(mx-mn)*0.08||1; mn-=pad; mx+=pad;
  const W=340,L=42,Rr=10,rowH=50,H=groups.length*rowH+40;
  const X=v=>{let r=(v-mn)/(mx-mn); if(D.low) r=1-r; return L+r*(W-L-Rr);};
  const rows=groups.map((g,i)=>{const y=32+i*rowH; const mean=g.vals.reduce((a,b)=>a+b,0)/g.vals.length;
    return `<text x="0" y="${y+5}" font-size="14" font-weight="600" fill="var(--ink)">${esc(g.name)}</text>

      <line x1="${X(mean).toFixed(1)}" x2="${X(mean).toFixed(1)}" y1="${y-11}" y2="${y+11}" stroke="var(--ink)" stroke-width="2.5"/>
      <text x="${Math.min(Math.max(X(mean),L+46),W-Rr-46).toFixed(1)}" y="${y-16}" font-size="12" text-anchor="middle" fill="var(--muted)">průměr ${fmt(rnd(mean,D.u),D.u)}</text>`;}).join("");
  const yb=groups.length*rowH+26;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rozložení výkonů podle tříd">${rows}
    <text x="${L}" y="${yb}" font-size="12" fill="var(--muted)">${fmt(rnd(D.low?mx:mn,D.u),D.u)} horší</text>

}

/* ---------- Rekordy ---------- */
function kandidati(){
  // nejlepší neschválený výkon v každé kategorii, který je lepší než rekord
  const best=new Map();
  for(const v of S.vykony.values()){
    if(v.zamitnuto||v.schvaleno||DISC[v.d].stara) continue;
    const k=v.g+"|"+v.d+"|"+v.sex; const r=S.rekordy.get(k);
    if(r&&r.vykon===v.id) continue;
    if(r&&!better(v.v,r.v,v.d)) continue;
    const b=best.get(k); if(!b||better(v.v,b.v,v.d)) best.set(k,v);
  }
  return [...best.values()].sort((a,b)=>b.datum.localeCompare(a.datum));
}

async function zalozitHeslo(){
  const h1=$("#n-h1").value, h2=$("#n-h2").value;

  const sul=b64(crypto.getRandomValues(new Uint8Array(16)));

function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"";
  const sep=[";",",","\t"].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; continue; }
    if(c==='"') q=true; else if(c===sep){row.push(cell);cell="";} else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";} else if(c!=="\r") cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
async function nactiTabulku(file){
  if(/\.xlsx?$/i.test(file.name)){
    const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]]; return X.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  }
  const buf=await file.arrayBuffer();
  let text=new TextDecoder("utf-8").decode(buf);
  if(text.includes("�")) text=new TextDecoder("windows-1250").decode(buf);
  return parseCSV(text);
}
const RIM={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9};
function parseTrida(s){
  s=String(s||"").trim().toUpperCase().replace(/\s+/g," ");
  let m=s.match(/^(IX|VIII|VII|VI|IV|V|III|II|I)\s*\.?\s*([A-Z])\b/); if(m) return {g:RIM[m[1]],pis:m[2]};
  m=s.match(/^([1-9])\s*\.?\s*([A-Z])\b/); if(m) return {g:+m[1],pis:m[2]};
  return null;
}
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
function hadejPohlavi(prijmeni,jmeno){
  const p=String(prijmeni).trim().toLowerCase();
  if(/(ová|ova|á)$/.test(p)) return "F";
  const j=String(jmeno).trim().toLowerCase();
  if(/(a|e|ie)$/.test(j)&&!/^(jirka|honza|nikola|sasha|saša|luca|ilja|ilya|jona)$/.test(j)) return /(ý|ský|ck[ýy])$/.test(p)?"M":"F";
  return "M";
}
function rozpoznejSloupce(rows){
  // najdi řádek s hlavičkou v prvních 10 řádcích
  for(let i=0;i<Math.min(10,rows.length);i++){
    const h=rows[i].map(norm);
    const f=k=>h.findIndex(x=>k.some(kk=>x===kk||x.startsWith(kk)));
    const tr=f(["trida","class","skupina"]), pr=f(["prijmeni","surname"]), jm=f(["jmeno","krestni","name"]), po=f(["pohlavi","sex"]), cele=f(["zak","jmenoaprijmeni","prijmeniajmeno","zaci"]);
    if(tr>=0&&((pr>=0&&jm>=0&&pr!==jm)||cele>=0)) return {i,tr,pr,jm:jm===pr?-1:jm,po,cele};
  }
  return null;
}
async function importZaku(file){
  const out=$("#n-zaci-out"); out.innerHTML='<p class="hint">Načítám…</p>';
  try{
    const rows=await nactiTabulku(file);
    const c=rozpoznejSloupce(rows);
    if(!c){out.innerHTML=`<p class="err">V souboru jsem nenašel sloupce třída, příjmení a jméno. První řádek: ${esc((rows[0]||[]).join(" | "))}</p>`;return;}
    const sy=SY_NOW(); const nove=[]; let spatne=0, hadano=0;
    for(const r of rows.slice(c.i+1)){
      const t=parseTrida(r[c.tr]); if(!t){spatne++;continue;}
      let p,j;
      if(c.pr>=0&&c.jm>=0){p=String(r[c.pr]).trim();j=String(r[c.jm]).trim();}
      else {const parts=String(r[c.cele]).trim().split(/\s+/);p=parts.shift()||"";j=parts.join(" ");}
      if(!p){spatne++;continue;}
      let sex=null;
      if(c.po>=0){const x=norm(r[c.po]);sex=/^(z|f|d|div|divka|zena|zenske|w)/.test(x)?"F":/^(m|ch|chl|chlapec|muz|muzske|k|kluk)/.test(x)?"M":null;}
      if(!sex){sex=hadejPohlavi(p,j);hadano++;}
      nove.push({p,j,pis:t.pis,coh:sy-t.g+1,sex,g:t.g});
    }
    if(!nove.length){out.innerHTML='<p class="err">Žádný žák se nenačetl.</p>';return;}
    const tridyN=new Map();for(const z of nove) tridyN.set(z.g+"."+z.pis,(tridyN.get(z.g+"."+z.pis)||0)+1);
    S._importZaci=nove;
    out.innerHTML=`<p style="margin-top:10px"><b>${nove.length} žáků</b> v ${tridyN.size} třídách: ${[...tridyN.entries()].sort((a,b)=>parseInt(a[0])-parseInt(b[0])||a[0].localeCompare(b[0])).map(([t,n])=>t+" ("+n+")").join(", ")}.</p>
      ${hadano?`<p class="hint">Pohlaví u ${hadano} žáků appka odhadla podle jména, opravit jde v profilu žáka.</p>`:""}
      ${spatne?`<p class="hint">${spatne} řádků bez třídy nebo jména jsem přeskočil.</p>`:""}
      <div class="btns"><button class="btn" id="n-zaci-ok">Uložit seznam</button></div>`;
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message)}</p>`;}
}
async function ulozitZaky(){
  const nove=S._importZaci; if(!nove||!KEY) return;
  const stari=[...S.zaci.values()];
  const podleKlice=new Map(stari.map(z=>[norm(z.p)+"|"+norm(z.j)+"|"+z.coh+"|"+z.pis,z]));
  const podleJmena=new Map();for(const z of stari){const k=norm(z.p)+"|"+norm(z.j);podleJmena.set(k,(podleJmena.get(k)||[]).concat(z));}
  const pouzite=new Set(); let novych=0, zmen=0;
  for(const n of nove){
    let z=podleKlice.get(norm(n.p)+"|"+norm(n.j)+"|"+n.coh+"|"+n.pis);
    if(!z||pouzite.has(z.id)){const c=(podleJmena.get(norm(n.p)+"|"+norm(n.j))||[]).filter(x=>!pouzite.has(x.id));z=c.length===1?c[0]:null;}
    const id=z?z.id:uid("z"); pouzite.add(id);
    const data={j:n.j,p:n.p,pis:n.pis,coh:n.coh,sex:z&&z.sexRucne?z.sex:n.sex,sexRucne:!!(z&&z.sexRucne),akt:true};
    if(!z) novych++;
    if(!z||z.j!==data.j||z.p!==data.p||z.pis!==data.pis||z.coh!==data.coh||z.sex!==data.sex||z.akt===false){
      await zapis("zaci",id,{enc:await zasifruj(data)}); S.zaci.set(id,{...data,id}); zmen++;
    }
  }
  let skryto=0;
  for(const z of stari) if(!pouzite.has(z.id)&&z.akt!==false){const data={...z,akt:false};delete data.id;await zapis("zaci",z.id,{enc:await zasifruj(data)});S.zaci.set(z.id,{...data,id:z.id});skryto++;}
  S._importZaci=null; render();
  toast(`Uloženo. Nových žáků ${novych}, změněných ${zmen-novych}, skrytých ${skryto}.`);
}
async function zmenitPohlavi(id){
  const z=S.zaci.get(id); if(!z||!KEY) return;
  const data={...z,sex:z.sex==="M"?"F":"M",sexRucne:true}; delete data.id;
  await zapis("zaci",id,{enc:await zasifruj(data)}); S.zaci.set(id,{...data,id});
  for(const v of S.vykony.values()) if(v.z===id&&v.sex!==data.sex&&smiMenit(v)){const nv={...v,sex:data.sex};delete nv.id;await zapis("vykony",v.id,nv);S.vykony.set(v.id,{...nv,id:v.id});}
  render(); toast("Pohlaví opraveno.");
}

/* ---------- import rekordů z Rekordmani.xlsx ---------- */
function mapDisc(label){
  const s=String(label).toLowerCase();
  if(s.includes("tafeta")) return null;
  if(/^\s*60\s*m/.test(s)) return "d60"; if(/^\s*200\s*m/.test(s)) return "d200"; if(/^\s*400\s*m/.test(s)) return "d400";
  if(/^\s*500\s*m/.test(s)) return "d500"; if(/^\s*1000\s*m/.test(s)) return "d1000";
  if(s.includes("místa")) return "zm"; if(s.includes("dalek")) return "dal"; if(s.includes("vysok")) return "vys";
  if(s.includes("raketk")) return "rak"; if(s.includes("míčk")) return "mic"; if(s.includes("koul")) return "kou"; if(s.includes("šplh")) return "spl";
  return undefined;
}
function hodnotaDatumu(c){
  if(!c) return "";
  if(c.t==="d"||c.v instanceof Date){const d=c.v instanceof Date?c.v:new Date(c.v);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  return String(c.w||c.v||"").trim();
}
async function importRekordu(file){
  const out=$("#n-rek-out"); out.innerHTML='<p class="hint">Načítám…</p>';
  try{
    const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const nalez=[];
    for(let g=1;g<=9;g++){
      const ws=wb.Sheets[g+".třída"]; if(!ws) continue;
      for(const [lc,vc,nc,dc,tc] of [["C","D","A","B","D"],["H","I","F","G","I"]]){
        const labels=[];
        for(let r=1;r<=90;r++){const c=ws[lc+r];if(c&&typeof c.v==="string"&&mapDisc(c.v)!==undefined) labels.push({r,label:c.v,d:mapDisc(c.v)});}
        labels.filter(x=>x.d!==null).forEach((x,i)=>{
          const sex=i%2===0?"M":"F";
          const val=ws[vc+x.r]; const raw=val?String(val.w||val.v):"";
          if(!raw||raw.startsWith("#")) return;
          const v=parseVal(raw,x.d); if(v==null||isNaN(v)) return;
          const jm=ws[nc+x.r]?String(ws[nc+x.r].v).replace(/\s*\n\s*/g," ").trim():"";
          if(jm.startsWith("#")) return;
          const tr=ws[tc+(x.r-3)]?String(ws[tc+(x.r-3)].w||ws[tc+(x.r-3)].v).trim():"";
          const dt=hodnotaDatumu(ws[dc+(x.r-3)]);
          nalez.push({g,d:x.d,sex,v,jm,tr,dt});
        });
      }
    }
    if(!nalez.length){out.innerHTML='<p class="err">V souboru jsem žádné rekordy nenašel. Je to Rekordmani.xlsx s listy 1.třída až 9.třída?</p>';return;}
    S._importRek=nalez;
    out.innerHTML=`<p style="margin-top:10px"><b>${nalez.length} rekordů</b> v ${new Set(nalez.map(x=>x.g)).size} ročnících.</p><div class="btns"><button class="btn" id="n-rek-ok">Uložit rekordy</button></div>`;
  }catch(e){out.innerHTML=`<p class="err">${esc(e.message)}</p>`;}
}
async function ulozitRekordy(){
  const list=S._importRek; if(!list||!KEY) return; let n=0;
  for(const x of list){
    const k=x.g+"|"+x.d+"|"+x.sex; const cur=S.rekordy.get(k);
    if(cur&&cur.zdroj==="appka"&&!better(x.v,cur.v,x.d)) continue;
    const rec={g:x.g,d:x.d,sex:x.sex,v:x.v,z:null,enc:await zasifruj({jm:x.jm}),tr:x.tr,dt:x.dt,zdroj:"nastenka"};
    await zapis("rekordy",k,rec); S.rekordy.set(k,{...rec,jm:x.jm}); n++;
  }
  S._importRek=null; render(); toast(`Uloženo ${n} rekordů z nástěnky.`);
}

/* ---------- export ---------- */
function exportCSV(){
  const rows=[["datum","třída","příjmení","jméno","pohlaví","disciplína","výkon","jednotka","zapsal"]];
  const all=[...S.vykony.values()].sort((a,b)=>a.datum.localeCompare(b.datum));
  for(const v of all){const z=S.zaci.get(v.z)||{};const D=DISC[v.d];rows.push([v.datum,v.tr,z.p||"",z.j||"",v.sex==="M"?"chlapec":"dívka",dn(v.d,v.g),D.u==="min"?fmt(v.v,"min").replace(" min",""):cz(v.v),D.u,v.autor||""]);}
  const csv="﻿"+rows.map(r=>r.map(x=>{x=String(x);return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="rekordnik-vykony-"+dnes()+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

 zaci:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg>',
 prehledy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9M3 20.5h18"/></svg>',
 rekordy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="15" r="5.5"/><path d="M8.5 10.5L6 3h4l2 5 2-5h4l-2.5 7.5"/></svg>'};
const TABS=[["mereni","Měření"],["zaci","Žáci"],["prehledy","Přehledy"],["rekordy","Rekordy"]];

  }catch(err){toast(err.message||String(err));}
